syntax = "proto3";

package orbit.streams.v1;

service BatchProcessor {
  rpc Process(StreamBatch) returns (StreamBatch);
}

message StreamRecord {
  string record_id = 1;
  bytes value = 2;
  int64 timestamp_ms = 3;
  optional bytes key = 4;
  string content_type = 5;
  map<string, string> headers = 6;
}

message StreamBatch {
  repeated StreamRecord records = 1;
  uint32 max_records = 2;
  uint32 max_bytes = 3;
}
