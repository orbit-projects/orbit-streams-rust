[package]
name = "orbit-streams-rust"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rust implementation of Orbit's stream-processing capability for Core process plugins"
readme = "README.md"
include = ["src/**", "proto/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[[example]]
name = "append_plugin"
path = "examples/append_plugin.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
